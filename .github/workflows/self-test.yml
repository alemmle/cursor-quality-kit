name: Self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh tests/*.sh core/bin/guard.sh core/githooks/* core/templates/verify.generic.sh stacks/*/template/scripts/verify.sh
      - name: actionlint
        if: runner.os == 'Linux'
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
      - name: Installer and guard tests
        run: tests/run.sh
