# Tags a release when VERSION on main has no matching tag: creates vX.Y.Z and moves vX.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create version and major tags
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          major="v${version%%.*}"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "AI Engineering Standard $version"
          git tag -f "$major"
          git push origin "v$version"
          git push -f origin "$major"
