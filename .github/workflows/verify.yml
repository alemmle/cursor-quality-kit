# Reusable: installs dependencies, then runs scripts/verify.sh in the caller.
# For stack=none, and for repositories whose package.json is not at the root
# (pass install-directory, e.g. web/).
# Uses only GitHub-owned actions (tests/run.sh checks this).
name: Verify

on:
  workflow_call:
    inputs:
      install-directory:
        description: Directory containing package.json or pubspec.yaml
        type: string
        default: .
      node-version:
        type: string
        default: '22'
      setup-flutter:
        description: Install Flutter before running the gate (also on when pubspec.yaml is in install-directory)
        type: boolean
        default: false
      flutter-version:
        description: Exact Flutter version (empty = latest on the channel)
        type: string
        default: ''
      channel:
        type: string
        default: stable

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: ${{ hashFiles(format('{0}/package.json', inputs.install-directory)) != '' }}
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.install-directory }}/package-lock.json

      - name: npm ci
        if: ${{ hashFiles(format('{0}/package.json', inputs.install-directory)) != '' }}
        working-directory: ${{ inputs.install-directory }}
        run: npm ci

      # Flutter comes from a git clone, not a marketplace action: this workflow may only
      # reference GitHub-owned actions, so repositories whose Actions settings allow
      # nothing else can still call it (a referenced action is checked even when its
      # step would be skipped).
      - name: Install Flutter
        if: ${{ inputs.setup-flutter || hashFiles(format('{0}/pubspec.yaml', inputs.install-directory)) != '' }}
        env:
          FLUTTER_REF: ${{ inputs.flutter-version != '' && inputs.flutter-version || inputs.channel }}
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_REF" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: flutter pub get
        if: ${{ inputs.setup-flutter || hashFiles(format('{0}/pubspec.yaml', inputs.install-directory)) != '' }}
        working-directory: ${{ inputs.install-directory }}
        run: flutter pub get

      - name: scripts/verify.sh
        run: ./scripts/verify.sh
        env:
          CI: 'true'
