name: AI quality gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  constitution:
    uses: {{KIT_REPO}}/.github/workflows/constitution.yml@{{KIT_REF}}
    with:
      kit-repo: {{KIT_REPO}}
      kit-ref: {{KIT_REF}}

  verify:
    uses: {{KIT_REPO}}/.github/workflows/expo-quality.yml@{{KIT_REF}}
