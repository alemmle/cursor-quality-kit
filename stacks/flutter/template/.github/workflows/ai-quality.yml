name: AI quality gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request stops the older run; runs on the default branch always finish.
concurrency:
  group: ai-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  constitution:
    uses: {{KIT_REPO}}/.github/workflows/constitution.yml@{{KIT_REF}}
    with:
      kit-repo: {{KIT_REPO}}
      kit-ref: {{KIT_REF}}

  verify:
    uses: {{KIT_REPO}}/.github/workflows/flutter-quality.yml@{{KIT_REF}}
